name: Deploy — Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: local-minikube
        type: choice
        options: [local-minikube, local-kind, eks-staging, eks-production]
      image_tag:
        description: "Image tag to deploy (defaults to git short SHA)"
        required: false
        default: ""

  # Auto-deploy to local-minikube on every main merge via the self-hosted runner.
  # Requires the runner service to be running (see k8s/scripts/setup-github-runner.sh).
  # push:
  #   branches: [main]

permissions:
  contents: read
  packages: write   # required to push/pull images from GHCR

env:
  REGISTRY: ghcr.io
  HELM_CHART: k8s/helm/techbleat-bank
  NAMESPACE: banking
  RELEASE: techbleat-bank

# local-minikube → self-hosted runner on THIS machine (has kubectl/helm/minikube)
# all others     → GitHub-hosted ubuntu-latest
#
# runs-on is computed inline to avoid the two-job fromJSON-output pattern,
# which GitHub Actions masks when the output contains a secret substring.
jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'local-minikube' }}
    runs-on: ${{ (inputs.environment == 'local-minikube' || inputs.environment == '') && fromJSON('["self-hosted","linux","local-minikube"]') || 'ubuntu-latest' }}
    environment: ${{ inputs.environment || 'local-minikube' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install helm (if not present)
        run: |
          if ! command -v helm &>/dev/null; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi
          helm version

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          ENV="${{ inputs.environment || 'local-minikube' }}"
          if [ -z "$TAG" ]; then
            if [ "$ENV" = "local-minikube" ]; then
              # Local dev: default to 'latest' — git-SHA tags only exist after a build-push run.
              TAG="latest"
            else
              TAG=$(git rev-parse --short HEAD)
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      # ── local-minikube (self-hosted runner on your WSL2 machine) ─────────────
      # The runner already has kubectl, helm, and kubeconfig for your minikube cluster.
      # Images are built directly into minikube's containerd (no Docker Hub push needed).
      - name: Verify minikube cluster (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          kubectl config use-context techbleat-bank 2>/dev/null \
            || kubectl config use-context $(kubectl config current-context)
          echo "Active context: $(kubectl config current-context)"
          kubectl cluster-info
          kubectl get nodes

      # Build all app images directly into minikube's containerd.
      # minikube image build works with the containerd runtime (no docker-env needed).
      # imagePullPolicy=IfNotPresent means Kubernetes uses these cached images and never
      # pulls from GHCR for local dev.  The ghcr.io/ prefix is just a name — minikube
      # stores images by their full tag; no push to any registry happens here.
      - name: Build images into minikube (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          minikube image build -t "${REGISTRY}/user-service:${TAG}" \
            techbleat-global-bank-backend/user-service/ --profile techbleat-bank
          minikube image build -t "${REGISTRY}/transaction-service:${TAG}" \
            techbleat-global-bank-backend/transaction-service/ --profile techbleat-bank
          minikube image build -t "${REGISTRY}/activity-service:${TAG}" \
            techbleat-global-bank-backend/activity-service/ --profile techbleat-bank
          minikube image build -t "${REGISTRY}/finance-agent:${TAG}" \
            finance-agent/ --profile techbleat-bank
          minikube image build \
            --profile techbleat-bank \
            -t "${REGISTRY}/frontend:${TAG}" \
            -f techbleat-global-bank-frontend/dockerfile \
            techbleat-global-bank-frontend/

      # Reset the Helm release if it is in a failed state (e.g. from a prior
      # --atomic rollback that itself failed due to immutable StatefulSet fields).
      # Uninstalling lets the next step do a clean helm upgrade --install.
      - name: Reset failed Helm release (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          STATUS=$(helm status ${{ env.RELEASE }} -n ${{ env.NAMESPACE }} -o json 2>/dev/null \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['status'])" 2>/dev/null \
            || echo "not-found")
          echo "Helm release status: ${STATUS}"
          if [ "${STATUS}" = "failed" ] || [ "${STATUS}" = "pending-upgrade" ]; then
            echo "Uninstalling failed release so the next step can do a clean install"
            helm uninstall ${{ env.RELEASE }} -n ${{ env.NAMESPACE }} --wait 2>/dev/null || true
          fi

      # volumeClaimTemplates are immutable in Kubernetes — Helm cannot patch them.
      # Always delete the Redis StatefulSet before upgrade so Helm recreates it
      # with the correct spec. --cascade=orphan keeps pods running during the
      # transition; data loss is acceptable in local dev.
      - name: Recreate Redis StatefulSet (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          STS_NAME="${{ env.RELEASE }}-redis"
          if kubectl get statefulset "${STS_NAME}" -n ${{ env.NAMESPACE }} &>/dev/null; then
            echo "Deleting ${STS_NAME} so Helm can recreate it with persistence"
            kubectl delete statefulset "${STS_NAME}" -n ${{ env.NAMESPACE }} --cascade=orphan
          fi

      - name: Helm deploy (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install ${{ env.RELEASE }} ${{ env.HELM_CHART }} \
            --namespace ${{ env.NAMESPACE }} \
            -f ${{ env.HELM_CHART }}/values.yaml \
            -f ${{ env.HELM_CHART }}/values-local.yaml \
            --set global.imageRegistry="ghcr.io/${{ github.repository_owner }}/" \
            --set global.imagePullPolicy=IfNotPresent \
            --set userService.image.tag="${TAG}" \
            --set transactionService.image.tag="${TAG}" \
            --set activityService.image.tag="${TAG}" \
            --set financeAgent.image.tag="${TAG}" \
            --set frontend.image.tag="${TAG}" \
            --set secrets.postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
            --set secrets.keycloakAdminPassword="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --set secrets.keycloakAdminClientSecret="${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}" \
            --set secrets.transactionServiceKcSecret="${{ secrets.TRANSACTION_SERVICE_KC_SECRET }}" \
            --set secrets.activityServiceKcSecret="${{ secrets.ACTIVITY_SERVICE_KC_SECRET }}" \
            --set secrets.financeAgentKcSecret="${{ secrets.FINANCE_AGENT_KC_SECRET }}" \
            --set secrets.openaiApiKey="${{ secrets.OPENAI_API_KEY }}" \
            --set secrets.anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
            --set secrets.datadogApiKey="${{ secrets.DATADOG_API_KEY }}"

      # ── GHCR build-and-push (kind + EKS) ─────────────────────────────────────
      # For GitHub-hosted runners (kind, EKS) images must be pushed to a registry.
      # GHCR is free for public repos and uses the built-in GITHUB_TOKEN — no extra secret needed.
      - name: Log in to GHCR (kind / EKS)
        if: ${{ inputs.environment == 'local-kind' || startsWith(inputs.environment, 'eks-') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images to GHCR (kind / EKS)
        if: ${{ inputs.environment == 'local-kind' || startsWith(inputs.environment, 'eks-') }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          docker build -t "${REGISTRY}/user-service:${TAG}" techbleat-global-bank-backend/user-service/
          docker push "${REGISTRY}/user-service:${TAG}"
          docker build -t "${REGISTRY}/transaction-service:${TAG}" techbleat-global-bank-backend/transaction-service/
          docker push "${REGISTRY}/transaction-service:${TAG}"
          docker build -t "${REGISTRY}/activity-service:${TAG}" techbleat-global-bank-backend/activity-service/
          docker push "${REGISTRY}/activity-service:${TAG}"
          docker build -t "${REGISTRY}/finance-agent:${TAG}" finance-agent/
          docker push "${REGISTRY}/finance-agent:${TAG}"
          docker build -t "${REGISTRY}/frontend:${TAG}" techbleat-global-bank-frontend/ -f techbleat-global-bank-frontend/dockerfile
          docker push "${REGISTRY}/frontend:${TAG}"

      # ── local-kind: spin up a kind cluster in the GitHub-hosted runner ───────
      - name: Setup kind cluster
        if: ${{ inputs.environment == 'local-kind' }}
        uses: helm/kind-action@v1
        with:
          config: k8s/scripts/kind-config.yaml
          cluster_name: techbleat-bank

      - name: Install NGINX ingress (kind)
        if: ${{ inputs.environment == 'local-kind' }}
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=90s

      - name: Pull and load images into kind
        if: ${{ inputs.environment == 'local-kind' }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          for SVC in user-service transaction-service activity-service finance-agent frontend; do
            docker pull ghcr.io/${{ github.repository_owner }}/${SVC}:${TAG} || true
            kind load docker-image ghcr.io/${{ github.repository_owner }}/${SVC}:${TAG} \
              --name techbleat-bank || true
          done

      - name: Helm deploy (local-kind)
        if: ${{ inputs.environment == 'local-kind' }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install ${{ env.RELEASE }} ${{ env.HELM_CHART }} \
            --namespace ${{ env.NAMESPACE }} \
            -f ${{ env.HELM_CHART }}/values.yaml \
            -f ${{ env.HELM_CHART }}/values-local.yaml \
            --set global.imageRegistry="ghcr.io/${{ github.repository_owner }}/" \
            --set global.imagePullPolicy=IfNotPresent \
            --set userService.image.tag="${TAG}" \
            --set transactionService.image.tag="${TAG}" \
            --set activityService.image.tag="${TAG}" \
            --set financeAgent.image.tag="${TAG}" \
            --set frontend.image.tag="${TAG}" \
            --set secrets.postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
            --set secrets.keycloakAdminPassword="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --set secrets.keycloakAdminClientSecret="${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}" \
            --set secrets.transactionServiceKcSecret="${{ secrets.TRANSACTION_SERVICE_KC_SECRET }}" \
            --set secrets.activityServiceKcSecret="${{ secrets.ACTIVITY_SERVICE_KC_SECRET }}" \
            --set secrets.financeAgentKcSecret="${{ secrets.FINANCE_AGENT_KC_SECRET }}" \
            --set secrets.openaiApiKey="${{ secrets.OPENAI_API_KEY }}" \
            --set secrets.anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
            --set secrets.datadogApiKey="${{ secrets.DATADOG_API_KEY }}" \
            --wait --timeout 15m

      # ── EKS staging / production ──────────────────────────────────────────
      - name: Configure AWS credentials
        if: ${{ startsWith(inputs.environment, 'eks-') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Update kubeconfig (EKS)
        if: ${{ startsWith(inputs.environment, 'eks-') }}
        run: |
          aws eks update-kubeconfig \
            --name ${{ vars.EKS_CLUSTER_NAME }} \
            --region ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Helm deploy (EKS)
        if: ${{ startsWith(inputs.environment, 'eks-') }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install ${{ env.RELEASE }} ${{ env.HELM_CHART }} \
            --namespace ${{ env.NAMESPACE }} \
            -f ${{ env.HELM_CHART }}/values.yaml \
            -f ${{ env.HELM_CHART }}/values-eks.yaml \
            --set global.imageRegistry="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com/" \
            --set userService.image.tag="${TAG}" \
            --set transactionService.image.tag="${TAG}" \
            --set activityService.image.tag="${TAG}" \
            --set financeAgent.image.tag="${TAG}" \
            --set frontend.image.tag="${TAG}" \
            --set secrets.postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
            --set secrets.keycloakAdminPassword="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --set secrets.keycloakAdminClientSecret="${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}" \
            --set secrets.transactionServiceKcSecret="${{ secrets.TRANSACTION_SERVICE_KC_SECRET }}" \
            --set secrets.activityServiceKcSecret="${{ secrets.ACTIVITY_SERVICE_KC_SECRET }}" \
            --set secrets.financeAgentKcSecret="${{ secrets.FINANCE_AGENT_KC_SECRET }}" \
            --set secrets.openaiApiKey="${{ secrets.OPENAI_API_KEY }}" \
            --set secrets.anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
            --set secrets.datadogApiKey="${{ secrets.DATADOG_API_KEY }}" \
            --wait --timeout 20m

      # ── Verify (all environments) ──────────────────────────────────────────
      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}
