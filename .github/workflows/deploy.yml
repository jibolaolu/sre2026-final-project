name: Deploy — Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: local-minikube
        type: choice
        options: [local-minikube, local-kind, eks-staging, eks-production]
      image_tag:
        description: "Image tag to deploy (defaults to git short SHA)"
        required: false
        default: ""

  # Auto-deploy to local-minikube on every main merge via the self-hosted runner.
  # Requires the runner service to be running (see k8s/scripts/setup-github-runner.sh).
  # push:
  #   branches: [main]

permissions:
  contents: read
  packages: write   # required to push/pull images from GHCR

env:
  REGISTRY: ghcr.io
  HELM_CHART: k8s/helm/techbleat-bank
  NAMESPACE: banking
  RELEASE: techbleat-bank

# local-minikube → self-hosted runner on THIS machine (has kubectl/helm/minikube)
# all others     → GitHub-hosted ubuntu-latest
#
# runs-on is computed inline to avoid the two-job fromJSON-output pattern,
# which GitHub Actions masks when the output contains a secret substring.
jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'local-minikube' }}
    runs-on: ${{ (inputs.environment == 'local-minikube' || inputs.environment == '') && fromJSON('["self-hosted","linux","local-minikube"]') || 'ubuntu-latest' }}
    environment: ${{ inputs.environment || 'local-minikube' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install helm (if not present)
        run: |
          if ! command -v helm &>/dev/null; then
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi
          helm version

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          ENV="${{ inputs.environment || 'local-minikube' }}"
          if [ -z "$TAG" ]; then
            if [ "$ENV" = "local-minikube" ]; then
              # Local dev: default to 'latest' — git-SHA tags only exist after a build-push run.
              TAG="latest"
            else
              TAG=$(git rev-parse --short HEAD)
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      # ── local-minikube (self-hosted runner on your WSL2 machine) ─────────────
      # The runner already has kubectl, helm, and kubeconfig for your minikube cluster.
      # Images are built directly into minikube's containerd (no Docker Hub push needed).
      - name: Verify minikube cluster (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          kubectl config use-context techbleat-bank 2>/dev/null \
            || kubectl config use-context $(kubectl config current-context)
          echo "Active context: $(kubectl config current-context)"
          kubectl cluster-info
          kubectl get nodes

      # Build all app images directly into minikube's containerd.
      # minikube image build works with the containerd runtime (no docker-env needed).
      # imagePullPolicy=IfNotPresent means Kubernetes uses these cached images and never
      # pulls from GHCR for local dev.  The ghcr.io/ prefix is just a name — minikube
      # stores images by their full tag; no push to any registry happens here.
      - name: Build images into minikube (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          minikube image build -t "${REGISTRY}/user-service:${TAG}" \
            techbleat-global-bank-backend/user-service/ --profile techbleat-bank
          minikube image build -t "${REGISTRY}/transaction-service:${TAG}" \
            techbleat-global-bank-backend/transaction-service/ --profile techbleat-bank
          minikube image build -t "${REGISTRY}/activity-service:${TAG}" \
            techbleat-global-bank-backend/activity-service/ --profile techbleat-bank
          minikube image build -t "${REGISTRY}/finance-agent:${TAG}" \
            finance-agent/ --profile techbleat-bank
          docker build \
            -t "${REGISTRY}/frontend:${TAG}" \
            --build-arg "VITE_KEYCLOAK_URL=${{ vars.VITE_KEYCLOAK_URL || 'https://auth.eaglesoncloude.com' }}" \
            --build-arg "VITE_KEYCLOAK_REALM=banking" \
            --build-arg "VITE_KEYCLOAK_CLIENT_ID=banking-frontend" \
            -f techbleat-global-bank-frontend/dockerfile \
            techbleat-global-bank-frontend/
          minikube image load "${REGISTRY}/frontend:${TAG}" --profile techbleat-bank

      # Ensure nginx ingress forwards X-Forwarded-Proto from Cloudflare so Keycloak
      # generates https:// OIDC URLs. Applied every deploy — idempotent patch.
      # Force a rolling restart for every app deployment so the freshly-built
      # 'latest' images are actually used.  With imagePullPolicy=IfNotPresent
      # and a fixed 'latest' tag, Kubernetes will NOT restart pods on its own
      # even after minikube image build rebuilds the image.
      - name: Restart app deployments (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          for DEPLOY in user-service transaction-service activity-service finance-agent frontend; do
            kubectl rollout restart deployment/techbleat-bank-${DEPLOY} -n ${{ env.NAMESPACE }} 2>/dev/null || true
          done
          kubectl rollout status deployment/techbleat-bank-frontend -n ${{ env.NAMESPACE }} --timeout=3m || true

      - name: Patch nginx ingress ConfigMap (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          kubectl patch configmap ingress-nginx-controller -n ingress-nginx \
            --type=merge -p '{"data":{"use-forwarded-headers":"true"}}' || true

      # Only uninstall when the release is stuck mid-upgrade (pending-upgrade),
      # which blocks any further helm upgrade.  A "failed" status is usually
      # caused by a failed post-upgrade hook (e.g. keycloak-provisioner); in
      # that case the workloads are running fine and a plain upgrade heals it —
      # a full uninstall would force a slow fresh install of all 12 services.
      - name: Reset failed Helm release (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          STATUS=$(helm status ${{ env.RELEASE }} -n ${{ env.NAMESPACE }} -o json 2>/dev/null \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['status'])" 2>/dev/null \
            || echo "not-found")
          echo "Helm release status: ${STATUS}"
          if [ "${STATUS}" = "pending-upgrade" ]; then
            echo "Release is stuck mid-upgrade — uninstalling for a clean install"
            helm uninstall ${{ env.RELEASE }} -n ${{ env.NAMESPACE }} --wait 2>/dev/null || true
          elif [ "${STATUS}" = "failed" ]; then
            echo "Release failed (likely a hook error) — skipping uninstall; upgrade will heal it"
          fi

      # volumeClaimTemplates are immutable in Kubernetes — Helm cannot patch them.
      # Always delete the Redis StatefulSet before upgrade so Helm recreates it
      # with the correct spec. --cascade=orphan keeps pods running during the
      # transition; data loss is acceptable in local dev.
      - name: Delete stuck Helm hooks (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          kubectl delete job -n ${{ env.NAMESPACE }} \
            -l "helm.sh/chart" --field-selector=status.successful=0 2>/dev/null || true
          kubectl delete job -n ${{ env.NAMESPACE }} \
            $(kubectl get jobs -n ${{ env.NAMESPACE }} 2>/dev/null \
              | grep -E "provisioner|hook" | awk '{print $1}') 2>/dev/null || true

      - name: Recreate Redis StatefulSet (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          STS_NAME="${{ env.RELEASE }}-redis"
          if kubectl get statefulset "${STS_NAME}" -n ${{ env.NAMESPACE }} &>/dev/null; then
            echo "Deleting ${STS_NAME} so Helm can recreate it with persistence"
            kubectl delete statefulset "${STS_NAME}" -n ${{ env.NAMESPACE }} --cascade=orphan
          fi

      - name: Helm deploy (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install ${{ env.RELEASE }} ${{ env.HELM_CHART }} \
            --namespace ${{ env.NAMESPACE }} \
            -f ${{ env.HELM_CHART }}/values.yaml \
            -f ${{ env.HELM_CHART }}/values-local.yaml \
            --set global.imageRegistry="ghcr.io/${{ github.repository_owner }}/" \
            --set global.imagePullPolicy=IfNotPresent \
            --set userService.image.tag="${TAG}" \
            --set transactionService.image.tag="${TAG}" \
            --set activityService.image.tag="${TAG}" \
            --set financeAgent.image.tag="${TAG}" \
            --set frontend.image.tag="${TAG}" \
            --set secrets.postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
            --set secrets.keycloakAdminPassword="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --set secrets.keycloakAdminClientSecret="${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}" \
            --set secrets.transactionServiceKcSecret="${{ secrets.TRANSACTION_SERVICE_KC_SECRET }}" \
            --set secrets.activityServiceKcSecret="${{ secrets.ACTIVITY_SERVICE_KC_SECRET }}" \
            --set secrets.financeAgentKcSecret="${{ secrets.FINANCE_AGENT_KC_SECRET }}" \
            --set secrets.openaiApiKey="${{ secrets.OPENAI_API_KEY }}" \
            --set secrets.anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
            --set secrets.datadogApiKey="${{ secrets.DATADOG_API_KEY }}" \
            --timeout 15m

      # Wait for Keycloak to be fully ready before the provisioner hook fires.
      # Helm --wait was removed to avoid timing out when other slow services
      # (Kafka, Postgres) delay the overall rollout.  The provisioner has its
      # own internal retry loop, but this explicit wait gives it a warm target.
      - name: Wait for Keycloak ready (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          echo "Waiting for Keycloak deployment to be ready (up to 10m)..."
          kubectl rollout status deployment/techbleat-bank-keycloak \
            -n ${{ env.NAMESPACE }} --timeout=10m || true
          echo "Waiting for Keycloak pod /realms/master endpoint (up to 5m)..."
          for i in $(seq 1 30); do
            POD=$(kubectl get pod -n ${{ env.NAMESPACE }} \
              -l app.kubernetes.io/component=keycloak \
              --field-selector=status.phase=Running \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
            if [ -n "$POD" ]; then
              STATUS=$(kubectl exec "$POD" -n ${{ env.NAMESPACE }} -- \
                curl -sf http://localhost:8080/realms/master -o /dev/null -w "%{http_code}" 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Keycloak is ready."
                break
              fi
            fi
            echo "Attempt $i/30: Keycloak not ready yet, retrying in 10s..."
            sleep 10
          done

      # ── GHCR build-and-push (kind + EKS) ─────────────────────────────────────
      # For GitHub-hosted runners (kind, EKS) images must be pushed to a registry.
      # GHCR is free for public repos and uses the built-in GITHUB_TOKEN — no extra secret needed.
      - name: Log in to GHCR (kind / EKS)
        if: ${{ inputs.environment == 'local-kind' || startsWith(inputs.environment, 'eks-') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images to GHCR (kind / EKS)
        if: ${{ inputs.environment == 'local-kind' || startsWith(inputs.environment, 'eks-') }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"
          docker build -t "${REGISTRY}/user-service:${TAG}" techbleat-global-bank-backend/user-service/
          docker push "${REGISTRY}/user-service:${TAG}"
          docker build -t "${REGISTRY}/transaction-service:${TAG}" techbleat-global-bank-backend/transaction-service/
          docker push "${REGISTRY}/transaction-service:${TAG}"
          docker build -t "${REGISTRY}/activity-service:${TAG}" techbleat-global-bank-backend/activity-service/
          docker push "${REGISTRY}/activity-service:${TAG}"
          docker build -t "${REGISTRY}/finance-agent:${TAG}" finance-agent/
          docker push "${REGISTRY}/finance-agent:${TAG}"
          docker build -t "${REGISTRY}/frontend:${TAG}" techbleat-global-bank-frontend/ -f techbleat-global-bank-frontend/dockerfile
          docker push "${REGISTRY}/frontend:${TAG}"

      # ── local-kind: spin up a kind cluster in the GitHub-hosted runner ───────
      - name: Setup kind cluster
        if: ${{ inputs.environment == 'local-kind' }}
        uses: helm/kind-action@v1
        with:
          config: k8s/scripts/kind-config.yaml
          cluster_name: techbleat-bank

      - name: Install NGINX ingress (kind)
        if: ${{ inputs.environment == 'local-kind' }}
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=90s

      - name: Pull and load images into kind
        if: ${{ inputs.environment == 'local-kind' }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          for SVC in user-service transaction-service activity-service finance-agent frontend; do
            docker pull ghcr.io/${{ github.repository_owner }}/${SVC}:${TAG} || true
            kind load docker-image ghcr.io/${{ github.repository_owner }}/${SVC}:${TAG} \
              --name techbleat-bank || true
          done

      - name: Helm deploy (local-kind)
        if: ${{ inputs.environment == 'local-kind' }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install ${{ env.RELEASE }} ${{ env.HELM_CHART }} \
            --namespace ${{ env.NAMESPACE }} \
            -f ${{ env.HELM_CHART }}/values.yaml \
            -f ${{ env.HELM_CHART }}/values-local.yaml \
            --set global.imageRegistry="ghcr.io/${{ github.repository_owner }}/" \
            --set global.imagePullPolicy=IfNotPresent \
            --set userService.image.tag="${TAG}" \
            --set transactionService.image.tag="${TAG}" \
            --set activityService.image.tag="${TAG}" \
            --set financeAgent.image.tag="${TAG}" \
            --set frontend.image.tag="${TAG}" \
            --set secrets.postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
            --set secrets.keycloakAdminPassword="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --set secrets.keycloakAdminClientSecret="${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}" \
            --set secrets.transactionServiceKcSecret="${{ secrets.TRANSACTION_SERVICE_KC_SECRET }}" \
            --set secrets.activityServiceKcSecret="${{ secrets.ACTIVITY_SERVICE_KC_SECRET }}" \
            --set secrets.financeAgentKcSecret="${{ secrets.FINANCE_AGENT_KC_SECRET }}" \
            --set secrets.openaiApiKey="${{ secrets.OPENAI_API_KEY }}" \
            --set secrets.anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
            --set secrets.datadogApiKey="${{ secrets.DATADOG_API_KEY }}" \
            --wait --timeout 15m

      # ── EKS staging / production ──────────────────────────────────────────
      - name: Configure AWS credentials
        if: ${{ startsWith(inputs.environment, 'eks-') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Update kubeconfig (EKS)
        if: ${{ startsWith(inputs.environment, 'eks-') }}
        run: |
          aws eks update-kubeconfig \
            --name ${{ vars.EKS_CLUSTER_NAME }} \
            --region ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Helm deploy (EKS)
        if: ${{ startsWith(inputs.environment, 'eks-') }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install ${{ env.RELEASE }} ${{ env.HELM_CHART }} \
            --namespace ${{ env.NAMESPACE }} \
            -f ${{ env.HELM_CHART }}/values.yaml \
            -f ${{ env.HELM_CHART }}/values-eks.yaml \
            --set global.imageRegistry="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com/" \
            --set userService.image.tag="${TAG}" \
            --set transactionService.image.tag="${TAG}" \
            --set activityService.image.tag="${TAG}" \
            --set financeAgent.image.tag="${TAG}" \
            --set frontend.image.tag="${TAG}" \
            --set secrets.postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
            --set secrets.keycloakAdminPassword="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --set secrets.keycloakAdminClientSecret="${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}" \
            --set secrets.transactionServiceKcSecret="${{ secrets.TRANSACTION_SERVICE_KC_SECRET }}" \
            --set secrets.activityServiceKcSecret="${{ secrets.ACTIVITY_SERVICE_KC_SECRET }}" \
            --set secrets.financeAgentKcSecret="${{ secrets.FINANCE_AGENT_KC_SECRET }}" \
            --set secrets.openaiApiKey="${{ secrets.OPENAI_API_KEY }}" \
            --set secrets.anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
            --set secrets.datadogApiKey="${{ secrets.DATADOG_API_KEY }}" \
            --wait --timeout 20m

      # ── Cloudflare Tunnel (local-minikube only) ────────────────────────────
      # Creates (or updates) the tunnel token secret from GitHub Secrets so
      # cloudflared is self-healing — no manual deploy-local.sh run needed
      # after a cluster reset or fresh deploy.
      - name: Apply cloudflared deployment (local-minikube)
        if: ${{ inputs.environment == 'local-minikube' || inputs.environment == '' }}
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" ]; then
            kubectl create secret generic cloudflare-tunnel-token \
              --from-literal=token="${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}" \
              -n ${{ env.NAMESPACE }} \
              --dry-run=client -o yaml | kubectl apply -f -
            kubectl apply -f k8s/cloudflare/cloudflared-deployment.yaml
            kubectl rollout restart deployment/cloudflared -n ${{ env.NAMESPACE }} 2>/dev/null || true
            echo "cloudflared deployed and restarted."
          else
            echo "Skipping cloudflared: CLOUDFLARE_TUNNEL_TOKEN secret not set in GitHub Actions."
            echo "Add it at: repo → Settings → Secrets and variables → Actions → New repository secret"
          fi

      # ── Verify (all environments) ──────────────────────────────────────────
      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}

      # ── Deploy summary ────────────────────────────────────────────────────
      - name: Deploy summary
        if: always()
        run: |
          ENV="${{ inputs.environment || 'local-minikube' }}"
          TAG="${{ steps.tag.outputs.tag }}"

          # Determine public URLs based on environment
          if [ "$ENV" = "local-minikube" ] || [ "$ENV" = "local-kind" ]; then
            FRONTEND_URL="https://banking-app.eaglesoncloude.com"
            KEYCLOAK_URL="https://auth.eaglesoncloude.com"
          else
            FRONTEND_URL="${{ vars.VITE_KEYCLOAK_URL || 'https://banking-app.eaglesoncloude.com' }}"
            KEYCLOAK_URL="https://auth.eaglesoncloude.com"
          fi

          # Collect pod readiness
          TOTAL=$(kubectl get pods -n ${{ env.NAMESPACE }} --no-headers 2>/dev/null | wc -l)
          READY=$(kubectl get pods -n ${{ env.NAMESPACE }} --no-headers 2>/dev/null \
            | awk '{split($2,r,"/"); if (r[1]==r[2] && r[1]!="0") count++} END{print count+0}')
          NOT_RUNNING=$(kubectl get pods -n ${{ env.NAMESPACE }} --no-headers 2>/dev/null \
            | grep -v " Running \| Completed " | awk '{print "  ⚠  "$1" — "$3}')

          # Collect image tags in use
          USER_SVC_IMG=$(kubectl get deployment techbleat-bank-user-service -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null | awk -F: '{print $NF}')
          TXN_SVC_IMG=$(kubectl get deployment techbleat-bank-transaction-service -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null | awk -F: '{print $NF}')
          FRONTEND_IMG=$(kubectl get deployment techbleat-bank-frontend -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null | awk -F: '{print $NF}')
          KC_IMG=$(kubectl get deployment techbleat-bank-keycloak -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null | awk -F: '{print $NF}')

          echo ""
          echo "════════════════════════════════════════════════════════════"
          echo "  TECHBLEAT GLOBAL BANK — DEPLOY SUMMARY"
          echo "════════════════════════════════════════════════════════════"
          echo "  Environment : $ENV"
          echo "  Image tag   : $TAG"
          echo "  Namespace   : ${{ env.NAMESPACE }}"
          echo "  Pods ready  : $READY / $TOTAL"
          echo ""
          echo "  ── URLs ─────────────────────────────────────────────────"
          echo "  Banking App      : $FRONTEND_URL"
          echo "  Keycloak Admin   : $KEYCLOAK_URL/admin  (user: admin)"
          echo "  Keycloak Realm   : $KEYCLOAK_URL/realms/banking"
          echo "  OIDC Discovery   : $KEYCLOAK_URL/realms/banking/.well-known/openid-configuration"
          echo ""
          echo "  ── Demo credentials ─────────────────────────────────────"
          echo "  Username : bankingdemo"
          echo "  Password : Demo@2024"
          echo ""
          echo "  ── Image tags in cluster ────────────────────────────────"
          echo "  frontend            : $FRONTEND_IMG"
          echo "  user-service        : $USER_SVC_IMG"
          echo "  transaction-service : $TXN_SVC_IMG"
          echo "  keycloak            : $KC_IMG"
          echo ""
          if [ -n "$NOT_RUNNING" ]; then
            echo "  ── Pods NOT running ─────────────────────────────────────"
            echo "$NOT_RUNNING"
            echo ""
          fi
          echo "════════════════════════════════════════════════════════════"
          echo ""
          # Also write to GitHub step summary (visible in the Actions UI)
          {
            echo "## Techbleat Global Bank — Deploy Summary"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Environment** | \`$ENV\` |"
            echo "| **Image tag** | \`$TAG\` |"
            echo "| **Pods ready** | $READY / $TOTAL |"
            echo ""
            echo "### URLs"
            echo "| Service | URL |"
            echo "|---|---|"
            echo "| Banking App | [$FRONTEND_URL]($FRONTEND_URL) |"
            echo "| Keycloak Admin | [$KEYCLOAK_URL/admin]($KEYCLOAK_URL/admin) |"
            echo "| Keycloak Realm | [$KEYCLOAK_URL/realms/banking]($KEYCLOAK_URL/realms/banking) |"
            echo ""
            echo "### Demo Login"
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Username | \`bankingdemo\` |"
            echo "| Password | \`Demo@2024\` |"
            echo ""
            if [ -n "$NOT_RUNNING" ]; then
              echo "### ⚠ Pods not running"
              echo "\`\`\`"
              echo "$NOT_RUNNING"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
