name: Deploy — Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: local-kind
        type: choice
        options: [local-kind, eks-staging, eks-production]
      image_tag:
        description: "Image tag to deploy (defaults to SHA of latest main commit)"
        required: false
        default: ""

  # Auto-deploy to local-kind on every main merge (optional — remove if not desired)
  # push:
  #   branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}
  HELM_CHART: k8s/helm/techbleat-bank
  NAMESPACE: banking
  RELEASE: techbleat-bank

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'local-kind' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'local-kind' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "3.16.0"

      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git rev-parse --short HEAD)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag: $TAG"

      # ── local-kind: spin up kind, load images, helm deploy ────────────────
      - name: Setup kind cluster
        if: ${{ inputs.environment == 'local-kind' || inputs.environment == '' }}
        uses: helm/kind-action@v1
        with:
          config: k8s/scripts/kind-config.yaml
          cluster_name: techbleat-bank

      - name: Install NGINX ingress (kind)
        if: ${{ inputs.environment == 'local-kind' || inputs.environment == '' }}
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          kubectl wait --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=90s

      - name: Pull and load images into kind
        if: ${{ inputs.environment == 'local-kind' || inputs.environment == '' }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          for SVC in user-service transaction-service activity-service finance-agent frontend; do
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${SVC}:${TAG} || true
            kind load docker-image ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${SVC}:${TAG} \
              --name techbleat-bank || true
          done

      - name: Helm deploy (local-kind)
        if: ${{ inputs.environment == 'local-kind' || inputs.environment == '' }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install ${{ env.RELEASE }} ${{ env.HELM_CHART }} \
            --namespace ${{ env.NAMESPACE }} \
            -f ${{ env.HELM_CHART }}/values.yaml \
            -f ${{ env.HELM_CHART }}/values-local.yaml \
            --set global.imageRegistry="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/" \
            --set global.imagePullPolicy=IfNotPresent \
            --set userService.image.tag="${TAG}" \
            --set transactionService.image.tag="${TAG}" \
            --set activityService.image.tag="${TAG}" \
            --set financeAgent.image.tag="${TAG}" \
            --set frontend.image.tag="${TAG}" \
            --set secrets.postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
            --set secrets.keycloakAdminPassword="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --set secrets.keycloakAdminClientSecret="${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}" \
            --wait --timeout 15m

      # ── EKS staging / production ──────────────────────────────────────────
      - name: Configure AWS credentials
        if: ${{ startsWith(inputs.environment, 'eks-') }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Update kubeconfig (EKS)
        if: ${{ startsWith(inputs.environment, 'eks-') }}
        run: |
          aws eks update-kubeconfig \
            --name ${{ vars.EKS_CLUSTER_NAME }} \
            --region ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Helm deploy (EKS)
        if: ${{ startsWith(inputs.environment, 'eks-') }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          helm upgrade --install ${{ env.RELEASE }} ${{ env.HELM_CHART }} \
            --namespace ${{ env.NAMESPACE }} \
            -f ${{ env.HELM_CHART }}/values.yaml \
            -f ${{ env.HELM_CHART }}/values-eks.yaml \
            --set global.imageRegistry="${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com/" \
            --set userService.image.tag="${TAG}" \
            --set transactionService.image.tag="${TAG}" \
            --set activityService.image.tag="${TAG}" \
            --set financeAgent.image.tag="${TAG}" \
            --set frontend.image.tag="${TAG}" \
            --set secrets.postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
            --set secrets.keycloakAdminPassword="${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}" \
            --set secrets.keycloakAdminClientSecret="${{ secrets.KEYCLOAK_ADMIN_CLIENT_SECRET }}" \
            --wait --timeout 20m

      - name: Verify deployment
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
          kubectl get ingress -n ${{ env.NAMESPACE }}
