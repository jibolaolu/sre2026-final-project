apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend-finance-agent
  namespace: banking
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: finance-agent
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["cluster.local/ns/banking/sa/frontend"]
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/chat", "/me", "/health", "/metrics"]
