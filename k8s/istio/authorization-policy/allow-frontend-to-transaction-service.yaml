apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-frontend-transaction-service
  namespace: banking
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: transaction-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/banking/sa/frontend"
              - "cluster.local/ns/banking/sa/finance-agent"
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/transactions", "/transactions/*", "/accounts", "/accounts/*",
                    "/actuator/health", "/actuator/prometheus"]
