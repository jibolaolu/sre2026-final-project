# Allow all services in the banking namespace to send telemetry to the OTel Collector.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-telemetry-to-otel-collector
  namespace: banking
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: otel-collector
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: ["banking"]
      to:
        - operation:
            ports: ["4317", "4318"]
