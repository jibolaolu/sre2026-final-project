apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: techbleat-bank-gateway
  namespace: banking
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "techbleat-bank.local"
        - "keycloak.techbleat-bank.local"
