apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: frontend
  namespace: banking
spec:
  hosts:
    - "techbleat-bank.local"
    - "frontend"
  gateways:
    - techbleat-bank-gateway
    - mesh
  http:
    - route:
        - destination:
            host: frontend
            port:
              number: 80
