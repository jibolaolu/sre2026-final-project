apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: keycloak
  namespace: banking
spec:
  hosts:
    - "keycloak.techbleat-bank.local"
    - "keycloak"
  gateways:
    - techbleat-bank-gateway
    - mesh
  http:
    - route:
        - destination:
            host: keycloak
            port:
              number: 8080
