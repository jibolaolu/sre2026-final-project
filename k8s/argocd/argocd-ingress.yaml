apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server-ingress
  namespace: argocd
  annotations:
    # ArgoCD runs with --insecure (HTTP only on 8080). Cloudflare terminates TLS
    # at the edge and sends plain HTTP to nginx. We proxy that HTTP to ArgoCD's
    # port 80 → pod 8080 without any backend TLS, eliminating the redirect loop
    # that occurred when backend-protocol: HTTPS tried to TLS-wrap an HTTP backend.
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd-banking.eaglesoncloude.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
