apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress
  namespace: banking
  annotations:
    meta.helm.sh/release-name: techbleat-bank
    meta.helm.sh/release-namespace: banking
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: frontend
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: user-service
      ports:
        - port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: transaction-service
      ports:
        - port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: activity-service
      ports:
        - port: 8001
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: finance-agent
      ports:
        - port: 9001
