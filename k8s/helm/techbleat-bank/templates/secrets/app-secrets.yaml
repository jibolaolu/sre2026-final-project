# ── Application secrets ────────────────────────────────────────────────────────
#
# IMPORTANT — Production usage:
#   Do NOT put real secrets in values.yaml or values-eks.yaml.  Instead, use the
#   External Secrets Operator (https://external-secrets.io) backed by AWS Secrets
#   Manager, HashiCorp Vault, or Azure Key Vault.  This file is intentionally kept
#   for dev / CI seeding with placeholder values.
#
#   Example ExternalSecret CRD (AWS Secrets Manager):
#
#     apiVersion: external-secrets.io/v1beta1
#     kind: ExternalSecret
#     metadata:
#       name: banking-app-secrets
#       namespace: {{ .Values.global.namespace }}
#     spec:
#       refreshInterval: 1h
#       secretStoreRef:
#         name: aws-secrets-manager
#         kind: ClusterSecretStore
#       target:
#         name: banking-app-secrets
#       data:
#         - secretKey: postgres-password
#           remoteRef:
#             key: /techbleat-bank/postgres-password
#         - secretKey: keycloak-admin-password
#           remoteRef:
#             key: /techbleat-bank/keycloak-admin-password
#         ...
#
{{- /*
  Use lookup to check if the secret already exists.
  If it does, skip rendering entirely — helm upgrade must not overwrite
  values injected by startup.sh (Phase 3).  helm.sh/resource-policy:keep
  only prevents deletion on helm uninstall, NOT updates on helm upgrade;
  the lookup guard is the correct way to make a secret immutable after
  first creation.
  On a fresh cluster (no existing secret) the block renders normally,
  seeding the secret from --set secrets.* values or CI secrets.
*/}}
{{- if not (lookup "v1" "Secret" .Values.global.namespace "banking-app-secrets") }}
apiVersion: v1
kind: Secret
metadata:
  name: banking-app-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  postgres-password: {{ .Values.secrets.postgresPassword | quote }}
  keycloak-admin-password: {{ .Values.secrets.keycloakAdminPassword | quote }}
  keycloak-admin-client-secret: {{ .Values.secrets.keycloakAdminClientSecret | quote }}
  transaction-service-kc-secret: {{ .Values.secrets.transactionServiceKcSecret | quote }}
  activity-service-kc-secret: {{ .Values.secrets.activityServiceKcSecret | quote }}
  finance-agent-kc-secret: {{ .Values.secrets.financeAgentKcSecret | quote }}
  openai-api-key: {{ .Values.secrets.openaiApiKey | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  datadog-api-key: {{ .Values.secrets.datadogApiKey | quote }}
  keycloak-demo-password: {{ .Values.secrets.keycloakDemoPassword | quote }}
  {{- if .Values.secrets.redisPassword }}
  redis-password: {{ .Values.secrets.redisPassword | quote }}
  {{- end }}
{{- end }}
