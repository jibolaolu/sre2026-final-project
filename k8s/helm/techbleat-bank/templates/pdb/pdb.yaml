{{- if gt (int .Values.userService.replicaCount) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "techbleat-bank.fullname" . }}-user-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
    app.kubernetes.io/component: user-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "techbleat-bank.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: user-service
{{- end }}
