{{- if .Values.istio.enabled }}
# ── Istio service-mesh security policies ──────────────────────────────────────
#
# Five layered controls:
#
#  1. PeerAuthentication  — PERMISSIVE at namespace level (nginx ingress has no
#     sidecar); STRICT on the data tier (postgres, redis, kafka) where every
#     caller is a sidecar-enabled pod.
#
#  2. SA-based source principals  — Replace coarse namespace checks with exact
#     SPIFFE identities (cluster.local/ns/banking/sa/<name>), so a compromised
#     pod cannot reach a data-tier service unless its ServiceAccount is listed.
#
#  3. RequestAuthentication  — Validate Keycloak JWTs at the Envoy proxy layer.
#     Malformed or expired tokens are rejected with HTTP 401 before the
#     application code is ever reached.  Requires istio.jwtIssuer to be set.
#
#  4. JWT-claim ABAC  — AuthorizationPolicy `when` conditions on
#     request.auth.claims[realm_access][roles] enforce Keycloak realm roles per
#     operation: banking-customer (read), banking-transact (write), and
#     banking-ai-agent (AI chat).
#
#  5. Path+method-level policies  — Fine-grained operation restrictions on
#     transaction-service (GET vs POST split) and finance-agent (/chat only).
#     Health and actuator paths are excluded from JWT requirements.

# ── 1. PeerAuthentication ─────────────────────────────────────────────────────

---
# Namespace-wide: PERMISSIVE keeps compatibility with the nginx ingress
# controller (no sidecar → cannot present a peer certificate).
# All pod-to-pod traffic within the mesh still negotiates mTLS automatically
# in PERMISSIVE mode — the sidecar pairs upgrade plain TCP to mTLS.
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: default
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
spec:
  mtls:
    mode: {{ .Values.istio.mtls | default "PERMISSIVE" }}

---
# Data-tier: STRICT mTLS for postgres, redis, and kafka.
# Every known caller of these services runs with an Istio sidecar
# (services, backup CronJobs, hook Jobs), so plain-text connections
# are never legitimate.  Any pod without a sidecar is refused at the
# Envoy layer even before AuthorizationPolicy is evaluated.
{{- range list "postgres" "redis" "kafka" }}
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: strict-mtls-{{ . }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ . }}
  mtls:
    mode: STRICT
{{- end }}

# ── Default deny ──────────────────────────────────────────────────────────────

---
# Deny everything that is not explicitly allowed.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: deny-all
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
spec: {}

# ── 3. RequestAuthentication ──────────────────────────────────────────────────
# Requires istio.jwtIssuer to be set.  When set, every Envoy sidecar on the
# API services validates incoming JWTs against Keycloak's JWKS endpoint.
# A request with a structurally invalid or expired token is rejected 401
# at the proxy.  A request with *no* token passes through (the
# requestPrincipal is simply empty), so unauthenticated health checks and
# internal service calls still work.

{{- if .Values.istio.jwtIssuer }}
{{- range list "user-service" "transaction-service" "activity-service" "finance-agent" }}
---
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: keycloak-jwt-{{ . }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ . }}
  jwtRules:
  - issuer: {{ $.Values.istio.jwtIssuer | quote }}
    jwksUri: {{ $.Values.istio.jwksUri | quote }}
    forwardOriginalToken: true
{{- end }}
{{- end }}

# ── Ingress → public-facing services ─────────────────────────────────────────
# nginx ingress sends plain HTTP with no service-account principal, so the
# `from` block is omitted and the rule matches on port only.

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  action: ALLOW
  rules:
  - to:
    - operation:
        ports: ["80"]

---
# Keycloak must be reachable from the browser (nginx has no sidecar → port-only
# rule).  This single policy covers both nginx ingress and backend services
# because any ALLOW match is sufficient.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-ingress-to-keycloak
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: keycloak
  action: ALLOW
  rules:
  - to:
    - operation:
        ports: ["8080"]

# ── 4+5. ABAC: Ingress + JWT-claim rules per API service ─────────────────────
# Three-tier rule structure per service:
#   a) Health / actuator paths — no authentication required
#   b) Internal SA principals — service-to-service calls bypass JWT checks
#   c) External with JWT claims — enforces Keycloak realm roles per method/path
#
# When istio.jwtIssuer is not set, tier (c) falls back to a port-only rule
# so the chart stays functional without JWT configured.

---
# user-service: banking-customer role for all user/account endpoints.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-user-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: user-service
  action: ALLOW
  rules:
  # (a) Health probes — no auth
  - to:
    - operation:
        methods: ["GET"]
        paths: ["/health", "/health/*", "/actuator", "/actuator/*"]
        ports: ["8000"]
  # (b) Internal service-to-service (mTLS SA principal, no JWT required)
  - from:
    - source:
        principals:
          - "cluster.local/ns/banking/sa/finance-agent"
          - "cluster.local/ns/banking/sa/transaction-service"
          - "cluster.local/ns/banking/sa/activity-service"
    to:
    - operation:
        ports: ["8000"]
  {{- if .Values.istio.jwtIssuer }}
  # (c) External: authenticated users with banking-customer role
  - from:
    - source:
        requestPrincipals: ["*"]
    to:
    - operation:
        ports: ["8000"]
    when:
    - key: request.auth.claims[realm_access][roles]
      values: ["banking-customer"]
  {{- else }}
  # Fallback: allow all when JWT is not configured
  - to:
    - operation:
        ports: ["8000"]
  {{- end }}

---
# transaction-service: GET requires banking-customer; POST/PUT/DELETE requires
# banking-transact (the role that permits initiating transfers).
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-transaction-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: transaction-service
  action: ALLOW
  rules:
  # (a) Health probes — no auth
  - to:
    - operation:
        methods: ["GET"]
        paths: ["/health", "/health/*", "/actuator", "/actuator/*"]
        ports: ["8080"]
  # (b) Internal SA principals
  - from:
    - source:
        principals:
          - "cluster.local/ns/banking/sa/user-service"
          - "cluster.local/ns/banking/sa/finance-agent"
          - "cluster.local/ns/banking/sa/activity-service"
    to:
    - operation:
        ports: ["8080"]
  {{- if .Values.istio.jwtIssuer }}
  # (c-read) GET: banking-customer role (read transaction history)
  - from:
    - source:
        requestPrincipals: ["*"]
    to:
    - operation:
        methods: ["GET"]
        ports: ["8080"]
    when:
    - key: request.auth.claims[realm_access][roles]
      values: ["banking-customer"]
  # (c-write) POST/PUT/DELETE: banking-transact role (initiate transfers)
  - from:
    - source:
        requestPrincipals: ["*"]
    to:
    - operation:
        methods: ["POST", "PUT", "PATCH", "DELETE"]
        ports: ["8080"]
    when:
    - key: request.auth.claims[realm_access][roles]
      values: ["banking-transact"]
  {{- else }}
  - to:
    - operation:
        ports: ["8080"]
  {{- end }}

---
# activity-service: banking-customer for reads; banking-transact for writes.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-activity-service
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: activity-service
  action: ALLOW
  rules:
  # (a) Health probes — no auth
  - to:
    - operation:
        methods: ["GET"]
        paths: ["/health", "/health/*", "/actuator", "/actuator/*"]
        ports: ["8001"]
  # (b) Internal SA principals
  - from:
    - source:
        principals:
          - "cluster.local/ns/banking/sa/user-service"
          - "cluster.local/ns/banking/sa/transaction-service"
          - "cluster.local/ns/banking/sa/finance-agent"
    to:
    - operation:
        ports: ["8001"]
  {{- if .Values.istio.jwtIssuer }}
  # (c-read) GET: banking-customer role
  - from:
    - source:
        requestPrincipals: ["*"]
    to:
    - operation:
        methods: ["GET"]
        ports: ["8001"]
    when:
    - key: request.auth.claims[realm_access][roles]
      values: ["banking-customer"]
  # (c-write) POST: banking-transact role (transaction events written to activity feed)
  - from:
    - source:
        requestPrincipals: ["*"]
    to:
    - operation:
        methods: ["POST", "PUT", "DELETE"]
        ports: ["8001"]
    when:
    - key: request.auth.claims[realm_access][roles]
      values: ["banking-transact"]
  {{- else }}
  - to:
    - operation:
        ports: ["8001"]
  {{- end }}

---
# finance-agent: banking-ai-agent role required for /chat.
# Health is unrestricted; every other path is blocked unless the user has
# the banking-ai-agent Keycloak role.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-to-finance-agent
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: finance-agent
  action: ALLOW
  rules:
  # (a) Health probes — no auth
  - to:
    - operation:
        methods: ["GET"]
        paths: ["/health", "/health/*", "/metrics"]
        ports: ["9001"]
  {{- if .Values.istio.jwtIssuer }}
  # (c) POST /chat: banking-ai-agent role only
  - from:
    - source:
        requestPrincipals: ["*"]
    to:
    - operation:
        methods: ["POST"]
        paths: ["/chat"]
        ports: ["9001"]
    when:
    - key: request.auth.claims[realm_access][roles]
      values: ["banking-ai-agent"]
  {{- else }}
  - to:
    - operation:
        ports: ["9001"]
  {{- end }}

# ── 2. SA-based intra-namespace data-plane policies ───────────────────────────
# These replace the coarse `source.namespaces` checks with exact SPIFFE
# service-account identities.  A pod must present a peer certificate whose
# principal matches one of the listed ServiceAccounts; any other pod in the
# namespace is denied even if it can reach the port at the network layer.

---
# Postgres: only the listed service SAs may connect.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-banking-to-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/user-service"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/transaction-service"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/activity-service"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/keycloak"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/postgres-backup"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/postgres-sync"

---
# Redis: only transaction-service and finance-agent use Redis.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-banking-to-redis
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: redis
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/transaction-service"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/finance-agent"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/redis-backup"

---
# Kafka: event producers and consumers.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-banking-to-kafka
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: kafka
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/user-service"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/transaction-service"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/activity-service"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/kafka-backup"

---
# OTel collector: telemetry from all application pods.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: allow-telemetry-to-otel-collector
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: otel-collector
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/user-service"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/transaction-service"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/activity-service"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/finance-agent"
          - "cluster.local/ns/{{ .Values.global.namespace }}/sa/frontend"
    to:
    - operation:
        ports: ["4317", "4318"]

{{- end }}
