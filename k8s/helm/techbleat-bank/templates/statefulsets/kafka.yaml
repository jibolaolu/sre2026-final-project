apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "techbleat-bank.fullname" . }}-kafka
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      {{- include "techbleat-bank.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        {{- include "techbleat-bank.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
      annotations:
        # Datadog autodiscovery — Kafka broker metrics + consumer group lag.
        # consumer_groups monitors the three app topics for lag on each consumer group.
        ad.datadoghq.com/kafka.checks: |
          {
            "kafka": {
              "init_config": {"is_jmx": true, "collect_default_metrics": true},
              "instances": [
                {
                  "host": "%%host%%",
                  "port": 9999,
                  "tags": ["kafka_cluster:techbleat-bank"]
                }
              ]
            },
            "kafka_consumer": {
              "init_config": {},
              "instances": [
                {
                  "kafka_connect_str": "%%host%%:29092",
                  "consumer_groups": {
                    "banking-activity-group": {
                      "txn.events": [],
                      "user.events": [],
                      "notifications": []
                    }
                  }
                }
              ]
            }
          }
    spec:
      serviceAccountName: kafka
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: fix-kafka-permissions
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["sh", "-c", "chown -R 1000:1000 /var/lib/kafka/data"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: kafka-internal
              containerPort: 29092
              protocol: TCP
            - name: kafka-ctrl
              containerPort: 29093
              protocol: TCP
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xmx1g -Xms256m"
            # KRaft controller startup timeouts — minikube is CPU-constrained;
            # default 1000ms timeouts cause the controller to fail to acknowledge
            # the broker during startup before its JVM threads are scheduled.
            - name: KAFKA_CONTROLLER_QUORUM_ELECTION_TIMEOUT_MS
              value: "30000"
            - name: KAFKA_CONTROLLER_QUORUM_ELECTION_BACKOFF_MAX_MS
              value: "10000"
            - name: KAFKA_CONTROLLER_QUORUM_FETCH_TIMEOUT_MS
              value: "30000"
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            # localhost:29093 bypasses bridge veth hairpin issues in minikube.
            # In single-node KRaft there are no remote voters, so loopback is correct.
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:29093"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            - name: CLUSTER_ID
              value: {{ .Values.kafka.clusterId | quote }}
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 10
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.kafka.persistence.size }}
