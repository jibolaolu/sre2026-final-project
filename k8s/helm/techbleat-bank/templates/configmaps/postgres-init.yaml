apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "techbleat-bank.fullname" . }}-postgres-init
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
data:
  00-databases.sql: |
    -- Create the Keycloak database if it doesn't exist.
    -- Keycloak production mode (start) requires an external DB; it will not start with H2.
    SELECT 'CREATE DATABASE keycloakdb'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'keycloakdb')\gexec
  init.sql: |
    -- Banking application schema
    -- This runs once when the PostgreSQL pod initialises a fresh volume.

    -- User profiles (managed by user-service)
    CREATE TABLE IF NOT EXISTS users (
        id          VARCHAR(100) PRIMARY KEY,
        full_name   VARCHAR(255) NOT NULL,
        email       VARCHAR(255) NOT NULL UNIQUE,
        created_at  TIMESTAMP DEFAULT NOW()
    );

    -- Bank accounts (one per user)
    CREATE TABLE IF NOT EXISTS accounts (
        user_id     VARCHAR(100) PRIMARY KEY REFERENCES users(id),
        balance     DOUBLE PRECISION NOT NULL DEFAULT 0,
        created_at  TIMESTAMP DEFAULT NOW()
    );

    -- Transaction ledger (managed by transaction-service)
    CREATE TABLE IF NOT EXISTS transactions (
        id               BIGSERIAL PRIMARY KEY,
        user_id          VARCHAR(100) NOT NULL,
        transaction_type VARCHAR(50)  NOT NULL,
        amount           DOUBLE PRECISION NOT NULL,
        reference        TEXT,
        created_at       TIMESTAMP DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_transactions_user_id ON transactions (user_id);

    -- Activity log (managed by activity-service)
    CREATE TABLE IF NOT EXISTS activities (
        id            BIGSERIAL PRIMARY KEY,
        user_id       VARCHAR(100) NOT NULL,
        activity_type VARCHAR(50)  NOT NULL,
        description   TEXT,
        created_at    TIMESTAMP DEFAULT NOW()
    );
    CREATE INDEX IF NOT EXISTS idx_activities_user_id ON activities (user_id);

    -- Seed demo user so bankingdemo works immediately after a fresh cluster setup
    INSERT INTO users (id, full_name, email) VALUES ('bankingdemo', 'Banking Demo', 'demo@techbleat-bank.local')
      ON CONFLICT (id) DO NOTHING;
    INSERT INTO accounts (user_id, balance) VALUES ('bankingdemo', 10000)
      ON CONFLICT (user_id) DO NOTHING;
