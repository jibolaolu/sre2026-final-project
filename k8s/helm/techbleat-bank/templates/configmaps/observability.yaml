{{- if .Values.observability.otelCollector.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "techbleat-bank.fullname" . }}-otel-collector-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      resource:
        attributes:
          - key: deployment.environment
            value: kubernetes
            action: upsert
    exporters:
      {{- if (.Values.observability.datadog | default dict).enabled }}
      datadog:
        api:
          site: {{ (.Values.observability.datadog | default dict).site | default "datadoghq.com" }}
          key: "${DD_API_KEY}"
        host_metadata:
          enabled: false
      {{- else }}
      debug:
        verbosity: basic
      {{- end }}
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch, resource]
          exporters: [{{ if (.Values.observability.datadog | default dict).enabled }}datadog{{ else }}debug{{ end }}]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [{{ if (.Values.observability.datadog | default dict).enabled }}datadog{{ else }}debug{{ end }}]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [{{ if (.Values.observability.datadog | default dict).enabled }}datadog{{ else }}debug{{ end }}]
{{- end }}
