---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  # Headless service required for KRaft self-connection.
  # With clusterIP: None, DNS resolves directly to the pod IP so the broker
  # can reach its own controller on kafka:29093 without kube-proxy NAT
  # (minikube bridge CNI does not support hairpin/self-connection via VIP).
  clusterIP: None
  selector:
    {{- include "techbleat-bank.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
  ports:
    - name: kafka-internal
      port: 29092
      targetPort: 29092
      protocol: TCP
    - name: kafka-controller
      port: 29093
      targetPort: 29093
      protocol: TCP
    - name: kafka-external
      port: 9092
      targetPort: 9092
      protocol: TCP
