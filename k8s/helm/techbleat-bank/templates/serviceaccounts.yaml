{{- $namespace := .Values.global.namespace }}
{{- $labels := include "techbleat-bank.labels" . }}
{{- range list "user-service" "transaction-service" "activity-service" "finance-agent" "frontend" "keycloak" "postgres" "redis" "kafka" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  namespace: {{ $namespace }}
  labels:
    {{- $labels | nindent 4 }}
    app.kubernetes.io/component: {{ . }}
automountServiceAccountToken: false
{{- end }}
