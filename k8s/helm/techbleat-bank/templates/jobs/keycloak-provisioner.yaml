# Helm post-install/post-upgrade hook that provisions the banking Keycloak realm.
# Runs after the Helm release is installed/upgraded and waits for Keycloak to be ready.
# Safe to re-run: all operations are idempotent (checks before creating).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "techbleat-bank.fullname" . }}-keycloak-provisioner
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "techbleat-bank.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak-provisioner
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        {{- include "techbleat-bank.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak-provisioner
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: keycloak
      containers:
        - name: provisioner
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          env:
            - name: KC_URL
              value: "http://keycloak:8080"
            - name: KC_REALM
              value: banking
            - name: KC_ADMIN_USER
              value: admin
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-app-secrets
                  key: keycloak-admin-password
            - name: PROVISIONER_SECRET
              valueFrom:
                secretKeyRef:
                  name: banking-app-secrets
                  key: keycloak-admin-client-secret
            - name: DEMO_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: banking-app-secrets
                  key: keycloak-demo-password
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # ── Wait for Keycloak ──────────────────────────────────────────
              echo "[provisioner] Waiting for Keycloak to be ready..."
              until curl -sf "${KC_URL}/realms/master" -o /dev/null; do
                echo "[provisioner] Keycloak not ready yet, retrying in 10s..."
                sleep 10
              done
              echo "[provisioner] Keycloak is ready."

              # ── Get admin token (with retry) ───────────────────────────────
              # Keycloak may report /realms/master ready before the admin user
              # is fully initialised.  Retry up to 12 times (60 s) before failing.
              TOKEN=""
              for i in $(seq 1 12); do
                TOKEN=$(curl -sf -X POST "${KC_URL}/realms/master/protocol/openid-connect/token" \
                  --data-urlencode "grant_type=password" \
                  --data-urlencode "client_id=admin-cli" \
                  --data-urlencode "username=${KC_ADMIN_USER}" \
                  --data-urlencode "password=${KC_ADMIN_PASSWORD}" \
                  | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4 || true)
                if [ -n "$TOKEN" ]; then
                  break
                fi
                echo "[provisioner] Admin token attempt $i/12 failed, retrying in 5s..."
                sleep 5
              done

              if [ -z "$TOKEN" ]; then
                echo "[provisioner] ERROR: Failed to get admin token after retries. Wrong password or Keycloak not ready."
                exit 1
              fi
              echo "[provisioner] Got admin token."

              KC_API="${KC_URL}/admin/realms"

              # ── Verify banking realm was imported ──────────────────────────
              REALM_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                "${KC_API}/${KC_REALM}" -H "Authorization: Bearer $TOKEN")
              if [ "$REALM_STATUS" != "200" ]; then
                echo "[provisioner] WARNING: banking realm not found (status $REALM_STATUS). Keycloak may still be importing."
                sleep 15
                TOKEN=$(curl -sf -X POST "${KC_URL}/realms/master/protocol/openid-connect/token" \
                  --data-urlencode "grant_type=password" \
                  --data-urlencode "client_id=admin-cli" \
                  --data-urlencode "username=${KC_ADMIN_USER}" \
                  --data-urlencode "password=${KC_ADMIN_PASSWORD}" \
                  | grep -o '"access_token":"[^"]*"' | cut -d'"' -f4)
              fi

              # ── Set banking-provisioner client secret ─────────────────────
              PROVISIONER_ID=$(curl -s "${KC_API}/${KC_REALM}/clients?clientId=banking-provisioner" \
                -H "Authorization: Bearer $TOKEN" \
                | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

              if [ -n "$PROVISIONER_ID" ]; then
                # Sync the banking-provisioner client secret to match the K8s secret.
                # This is idempotent and handles: first boot, secret rotation, and the
                # productionMode migration where --import-realm skips existing realms.
                FULL_CLIENT=$(curl -s "${KC_API}/${KC_REALM}/clients/${PROVISIONER_ID}" \
                  -H "Authorization: Bearer $TOKEN")
                if [ -n "$FULL_CLIENT" ]; then
                  # Use | as sed delimiter to avoid conflict with / inside character classes.
                  # Replaces "secret":"<old>" with "secret":"<new>" in the full client JSON.
                  PATCHED_CLIENT=$(printf '%s' "$FULL_CLIENT" | \
                    sed 's|"secret":"[^"]*"|"secret":"'"${PROVISIONER_SECRET}"'"|g')
                  PUT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                    -X PUT "${KC_API}/${KC_REALM}/clients/${PROVISIONER_ID}" \
                    -H "Authorization: Bearer $TOKEN" \
                    -H "Content-Type: application/json" \
                    -d "$PATCHED_CLIENT")
                  [ "$PUT_STATUS" = "204" ] \
                    && echo "[provisioner] banking-provisioner client secret synced (HTTP 204)." \
                    || echo "[provisioner] WARNING: client secret sync returned HTTP ${PUT_STATUS}."
                fi

                # Grant realm-admin role to service account
                SA_ID=$(curl -s "${KC_API}/${KC_REALM}/clients/${PROVISIONER_ID}/service-account-user" \
                  -H "Authorization: Bearer $TOKEN" \
                  | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

                MANAGE_USERS_ROLE=$(curl -s "${KC_API}/${KC_REALM}/roles/manage-users-role" \
                  -H "Authorization: Bearer $TOKEN" 2>/dev/null)

                # Grant manage-users via realm-management client role
                REALM_MGMT_ID=$(curl -s "${KC_API}/${KC_REALM}/clients?clientId=realm-management" \
                  -H "Authorization: Bearer $TOKEN" \
                  | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

                if [ -n "$REALM_MGMT_ID" ] && [ -n "$SA_ID" ]; then
                  MANAGE_USERS=$(curl -s "${KC_API}/${KC_REALM}/clients/${REALM_MGMT_ID}/roles/manage-users" \
                    -H "Authorization: Bearer $TOKEN")
                  MANAGE_USERS_ID=$(echo "$MANAGE_USERS" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
                  VIEW_USERS_ID=$(curl -s "${KC_API}/${KC_REALM}/clients/${REALM_MGMT_ID}/roles/view-users" \
                    -H "Authorization: Bearer $TOKEN" \
                    | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
                  if [ -n "$MANAGE_USERS_ID" ]; then
                    curl -s -X POST "${KC_API}/${KC_REALM}/users/${SA_ID}/role-mappings/clients/${REALM_MGMT_ID}" \
                      -H "Authorization: Bearer $TOKEN" \
                      -H "Content-Type: application/json" \
                      -d "[{\"id\":\"${MANAGE_USERS_ID}\",\"name\":\"manage-users\"},{\"id\":\"${VIEW_USERS_ID}\",\"name\":\"view-users\"}]" \
                      -o /dev/null
                    echo "[provisioner] Granted manage-users to banking-provisioner service account."
                  fi
                fi
              else
                echo "[provisioner] WARNING: banking-provisioner client not found; realm import may not have completed."
              fi

              # ── Ensure realm roles exist ──────────────────────────────────
              for ROLE_DEF in \
                'banking-customer|Standard banking customer' \
                'banking-transact|Permission to initiate banking transactions' \
                'banking-ai-agent|Access to the FinanceAgent AI banking assistant'; do
                ROLE_NAME=$(echo "$ROLE_DEF" | cut -d'|' -f1)
                ROLE_DESC=$(echo "$ROLE_DEF" | cut -d'|' -f2)
                ROLE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                  "${KC_API}/${KC_REALM}/roles/${ROLE_NAME}" -H "Authorization: Bearer $TOKEN")
                if [ "$ROLE_STATUS" = "404" ]; then
                  curl -s -X POST "${KC_API}/${KC_REALM}/roles" \
                    -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                    -d "{\"name\":\"${ROLE_NAME}\",\"description\":\"${ROLE_DESC}\"}" -o /dev/null
                  echo "[provisioner] Created role: ${ROLE_NAME}."
                fi
              done

              # ── Create demo user ──────────────────────────────────────────
              DEMO_EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
                "${KC_API}/${KC_REALM}/users?username=bankingdemo" -H "Authorization: Bearer $TOKEN")

              DEMO_ID=$(curl -s "${KC_API}/${KC_REALM}/users?username=bankingdemo" \
                -H "Authorization: Bearer $TOKEN" \
                | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)

              if [ -z "$DEMO_ID" ]; then
                curl -s -X POST "${KC_API}/${KC_REALM}/users" \
                  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                  -d '{"username":"bankingdemo","email":"demo@techbleat-bank.local","firstName":"Banking","lastName":"Demo","enabled":true,"emailVerified":true}' \
                  -o /dev/null
                DEMO_ID=$(curl -s "${KC_API}/${KC_REALM}/users?username=bankingdemo" \
                  -H "Authorization: Bearer $TOKEN" \
                  | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
                echo "[provisioner] Created demo user (ID: $DEMO_ID)."
              else
                echo "[provisioner] Demo user already exists."
              fi

              if [ -n "$DEMO_ID" ]; then
                # Set permanent password
                curl -s -X PUT "${KC_API}/${KC_REALM}/users/${DEMO_ID}/reset-password" \
                  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                  -d "{\"type\":\"password\",\"value\":\"${DEMO_USER_PASSWORD}\",\"temporary\":false}" -o /dev/null

                # Assign banking-customer, banking-transact, banking-ai-agent roles
                ROLES_JSON="["
                FIRST=true
                for RNAME in "banking-customer" "banking-transact" "banking-ai-agent"; do
                  R_BODY=$(curl -s "${KC_API}/${KC_REALM}/roles/${RNAME}" \
                    -H "Authorization: Bearer $TOKEN")
                  R_ID=$(echo "$R_BODY" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
                  if [ -n "$R_ID" ]; then
                    if [ "$FIRST" = "true" ]; then
                      FIRST=false
                    else
                      ROLES_JSON="${ROLES_JSON},"
                    fi
                    ROLES_JSON="${ROLES_JSON}{\"id\":\"${R_ID}\",\"name\":\"${RNAME}\"}"
                  fi
                done
                ROLES_JSON="${ROLES_JSON}]"
                curl -s -X POST "${KC_API}/${KC_REALM}/users/${DEMO_ID}/role-mappings/realm" \
                  -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                  -d "${ROLES_JSON}" -o /dev/null
                echo "[provisioner] Assigned banking-customer, banking-transact, banking-ai-agent to demo user."
              fi

              echo "[provisioner] Provisioning complete."
