# values-local.yaml — kind / Docker Desktop local overrides
#
# Usage:
#   helm upgrade --install techbleat-bank ./k8s/helm/techbleat-bank \
#     -f k8s/helm/techbleat-bank/values.yaml \
#     -f k8s/helm/techbleat-bank/values-local.yaml \
#     --set global.imageRegistry="YOURDOCKERHUBUSER/" \
#     --set secrets.postgresPassword="<your-postgres-password>" \
#     --set secrets.keycloakAdminPassword="<your-keycloak-admin-password>" \
#     --set secrets.keycloakAdminClientSecret="<generated-or-fixed-secret>"
#
# Hostnames — add to /etc/hosts (or C:\Windows\System32\drivers\etc\hosts):
#   127.0.0.1 techbleat-bank.local keycloak.techbleat-bank.local
#
# On Windows with kind, use the kind node IP:
#   kubectl get node -o wide   # find INTERNAL-IP
#   <node-ip> techbleat-bank.local keycloak.techbleat-bank.local

global:
  imageRegistry: "ghcr.io/jibolaolu/"   # set here so ArgoCD syncs with valid images
  imagePullPolicy: Always   # Always pull so pods automatically pick up the latest GHCR build
  storageClass: standard     # kind default storage class

# ── Public URLs (used by Keycloak KC_HOSTNAME and frontend build args) ──────
publicFrontendUrl: "https://banking-app.eaglesoncloude.com"
publicKeycloakUrl: "https://auth.eaglesoncloude.com"

# ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
  tls: []    # No TLS for plain local; Cloudflare terminates TLS at the edge
  hosts:
    - host: techbleat-bank.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
    - host: banking-app.eaglesoncloude.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 80
    # keycloak.techbleat-bank.local and auth.eaglesoncloude.com are handled by the
    # dedicated keycloak ingress (techbleat-bank-keycloak) via publicKeycloakUrl.

# ── TLS — cert-manager self-signed (optional for local HTTPS) ───────────────
tls:
  enabled: false          # set true to wire cert-manager ClusterIssuer
  issuerName: selfsigned-issuer
  issuerKind: ClusterIssuer

# ── Scale down for local resource constraints ────────────────────────────────
keycloak:
  replicaCount: 1
  productionMode: true   # true = start + PostgreSQL (persistent); false = start-dev + H2 (ephemeral)
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    liveness:
      initialDelaySeconds: 180   # production mode schema init needs extra time
      periodSeconds: 20
      failureThreshold: 5
    readiness:
      initialDelaySeconds: 90    # give PostgreSQL schema creation time on first boot
      periodSeconds: 10

userService:
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    tag: "latest"

transactionService:
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    tag: "latest"
  env:
    springDatasourceUrl: "jdbc:postgresql://postgres:5432/bankingdb?sslmode=disable"
    keycloakJwkSetUri: "http://keycloak:8080/realms/banking/protocol/openid-connect/certs"
    frontendOrigin: "https://banking-app.eaglesoncloude.com"

activityService:
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    tag: "latest"
  env:
    frontendOrigin: "https://banking-app.eaglesoncloude.com"

financeAgent:
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    tag: "latest"
  proxy:
    # Leave empty to let pods connect to OpenAI/Anthropic directly via the
    # allow-finance-agent-external-api NetworkPolicy (port 443 egress, no to: selector).
    # The WSL2 HTTPS_PROXY approach had TCP-level CONNECT resets due to Docker iptables.
    httpsProxy: ""
    noProxy: ""

frontend:
  replicaCount: 1
  autoscaling:
    enabled: false
  image:
    tag: "latest"

# ── Istio ─────────────────────────────────────────────────────────────────────
# minikube installs Istio by default; set false if you skipped istio addon.
# PERMISSIVE is required: nginx ingress has no sidecar so cannot do mTLS.
istio:
  enabled: true
  mtls: PERMISSIVE

# ── Observability ─────────────────────────────────────────────────────────────
observability:
  # 4317 = gRPC (OTLP/gRPC), 4318 = HTTP/protobuf (OTLP/HTTP)
  # The OTel Java agent uses OkHttp (HTTP/1.1) so it must target port 4318.
  # Python services also default to OTLP/HTTP.
  otelEndpoint: "http://otel-collector:4318"
  otelCollector:
    enabled: true
  datadog:
    enabled: false   # set true + add DD_API_KEY to .env when you have a Datadog account
    site: "datadoghq.eu"   # EU account — change to datadoghq.com for US
    env: "local"

# ── Keycloak client redirect URIs (local) ───────────────────────────────────
keycloakClients:
  frontendRedirectUris:
    - "https://banking-app.eaglesoncloude.com/*"
    - "http://techbleat-bank.local/*"
    - "http://localhost:3180/*"
  frontendWebOrigins:
    - "https://banking-app.eaglesoncloude.com"
    - "http://techbleat-bank.local"
    - "http://localhost:3180"
