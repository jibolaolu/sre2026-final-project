spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Flyway manages schema; use validate so Hibernate confirms entities match without altering.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
# baseline-on-migrate lets Flyway adopt a pre-existing schema on first run.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
server.port=${SERVER_PORT:8080}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}

# ── Actuator / Prometheus metrics ─────────────────────────────────────────────
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus}
management.endpoint.prometheus.enabled=${MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED:true}
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true

# ── Spring Security OAuth2 Resource Server (Keycloak) ─────────────────────────
# Set KEYCLOAK_JWK_SET_URI to activate JWT validation; if unset the bean is
# auto-configured to disabled mode and all requests pass through (dev default).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:}

# ── springdoc OpenAPI ─────────────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
