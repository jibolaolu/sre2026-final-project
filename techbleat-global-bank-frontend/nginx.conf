# log_format must be at the http{} level (this file is included inside http{}).
log_format trace_fmt '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" '
                     'req_id=$request_id';

server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS so upstream hostnames are resolved per-request,
    # not at nginx startup — prevents "host not found in upstream" crashes when
    # a backend container hasn't started yet.
    resolver 127.0.0.11 valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log trace_fmt;

    # React/Vite frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI user service
    location /user-api/ {
        set $upstream_user http://user-service:8000;
        rewrite ^/user-api/(.*)$ /$1 break;
        proxy_pass $upstream_user;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID   $request_id;
        proxy_set_header traceparent    $http_traceparent;
        proxy_set_header tracestate     $http_tracestate;
        add_header X-Request-ID         $request_id always;
    }

    # Spring Boot transaction service
    location /transaction-api/ {
        set $upstream_txn http://transaction-service:8080;
        rewrite ^/transaction-api/(.*)$ /$1 break;
        proxy_pass $upstream_txn;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID   $request_id;
        proxy_set_header traceparent    $http_traceparent;
        proxy_set_header tracestate     $http_tracestate;
        add_header X-Request-ID         $request_id always;
    }

    # FastAPI activity service
    location /activity-api/ {
        set $upstream_activity http://activity-service:8001;
        rewrite ^/activity-api/(.*)$ /$1 break;
        proxy_pass $upstream_activity;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID   $request_id;
        proxy_set_header traceparent    $http_traceparent;
        proxy_set_header tracestate     $http_tracestate;
        add_header X-Request-ID         $request_id always;
    }

    # FinanceAgent API
    location /finance-agent-api/ {
        set $upstream_agent http://finance-agent:9001;
        rewrite ^/finance-agent-api/(.*)$ /$1 break;
        proxy_pass $upstream_agent;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization  $http_authorization;
        proxy_set_header X-Request-ID   $request_id;
        proxy_set_header traceparent    $http_traceparent;
        proxy_set_header tracestate     $http_tracestate;
        add_header X-Request-ID         $request_id always;
    }

    location = /frontend-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }
}
